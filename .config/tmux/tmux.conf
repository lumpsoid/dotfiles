# ~/.tmux.conf - A Beautiful and Ninja-Level tmux Configuration
# Reload this config with: tmux source-file ~/.tmux.conf

#==============================================================================
# GENERAL SETTINGS
#==============================================================================

# Set true color support (24-bit color)
set-option -sa terminal-overrides ",foot*:Tc"

# Enable mouse support for modern workflow
set -g mouse on

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback buffer size for better history
set -g history-limit 50000

# Display messages for 4 seconds instead of default 750ms
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Aggressive resize - useful when multiple clients are attached
setw -g aggressive-resize on

# Don't exit tmux when closing a session
set -g detach-on-destroy off

#==============================================================================
# KEYBINDINGS - VIM-INSPIRED AND EFFICIENT
#==============================================================================

# Reload configuration file with r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using | and - (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-H previous-window
bind -n M-L next-window

# Move windows left/right
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Copy mode with vim keybindings
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'  # macOS
# For Linux, use: bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Toggle synchronize-panes (send input to all panes)
bind S setw synchronize-panes

#==============================================================================
# VISUAL DESIGN - MODERN TOKYO NIGHT THEME
#==============================================================================

# Color palette inspired by Tokyo Night
# Background: #1a1b26, Foreground: #c0caf5, Blue: #7aa2f7, Purple: #bb9af7
# Green: #9ece6a, Yellow: #e0af68, Red: #f7768e, Orange: #ff9e64

# Status bar design
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#1a1b26 fg=#c0caf5'
set -g status-left-length 100
set -g status-right-length 100

# Left side of status bar - session info with beautiful icons
set -g status-left '#[bg=#7aa2f7,fg=#1a1b26,bold] 󱂵 #S #[bg=#1a1b26,fg=#7aa2f7]'

# Right side of status bar - system info with icons
set -g status-right '#[fg=#bb9af7]#[bg=#bb9af7,fg=#1a1b26] 󰃰 %m/%d #[bg=#e0af68,fg=#1a1b26] 󰥔 %H:%M #[bg=#9ece6a,fg=#1a1b26] 󰻠 #h '

# Window status format
setw -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W #[fg=#7aa2f7,bg=#1a1b26]'
setw -g window-status-format '#[fg=#565f89] #I #W '

# Pane border colors
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Message styling
set -g message-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g message-command-style 'bg=#bb9af7 fg=#1a1b26 bold'

# Clock mode color
setw -g clock-mode-colour '#7aa2f7'

# Copy mode highlighting
setw -g mode-style 'bg=#bb9af7 fg=#1a1b26 bold'

#==============================================================================
# PLUGINS - TPM (Tmux Plugin Manager)
#==============================================================================
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible tmux defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Better pane management
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Fuzzy finder for tmux
set -g @plugin 'sainnhe/tmux-fzf'

# CPU and GPU status
set -g @plugin 'tmux-plugins/tmux-cpu'

#==============================================================================
# PLUGIN CONFIGURATIONS
#==============================================================================

# Resurrect settings - restore vim/nvim sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings - auto save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# CPU plugin settings
set -g @cpu_low_icon "󰾆"
set -g @cpu_medium_icon "󰾅"
set -g @cpu_high_icon "󰾄"
set -g @cpu_low_fg_color "#9ece6a"
set -g @cpu_medium_fg_color "#e0af68"
set -g @cpu_high_fg_color "#f7768e"

# FZF settings
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

#==============================================================================
# CONDITIONAL CONFIGURATIONS
#==============================================================================

# Platform-specific clipboard integration
if-shell "uname | grep -q Darwin" {
    # macOS
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
    # Linux
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

#==============================================================================
# ADVANCED FEATURES
#==============================================================================

# Popup window for quick commands
bind g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
bind t display-popup -d '#{pane_current_path}' -w80% -h80% -E 'htop'
bind f display-popup -d '#{pane_current_path}' -w80% -h80% -E 'yazi'

# Session management
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Quick edit config
bind M split-window -h "nvim ~/.tmux.conf"

#==============================================================================
# INITIALIZATION
#==============================================================================

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

#==============================================================================
# USAGE NOTES
#==============================================================================
# 
# Key Features:
# - Beautiful Tokyo Night color scheme with icons
# - Vim-inspired navigation (hjkl for pane switching)
# - Smart clipboard integration (works on macOS and Linux)
# - Session persistence with resurrect/continuum
# - Popup windows for common tools (lazygit, htop, ranger)
# - Fuzzy finder integration for URLs and sessions
# - Mouse support enabled
# - CPU monitoring in status bar
#
# Quick Reference:
# - Prefix: C-a (Ctrl+a)
# - Split horizontal: C-a |
# - Split vertical: C-a -
# - Navigate panes: C-a hjkl or C-hjkl (with vim awareness)
# - Resize panes: C-a HJKL
# - Copy mode: C-a Enter
# - Reload config: C-a r
# - Popup lazygit: C-a g
# - Popup htop: C-a t
# - Session switcher: C-a C-j
#
# Installation:
# 1. Save this as ~/.tmux.conf
# 2. Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# 3. Start tmux and press C-a I to install plugins
# 4. Install optional tools: lazygit, htop, ranger, fzf for full functionality
#
#==============================================================================
