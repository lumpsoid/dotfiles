[colors]
# Basic colors
foreground = dcd7ba
background = 1e1e2e

# Cursor colors
cursor = dcd7ba 1e1e2e

# ANSI colors
regular0 = 151521  # Black
regular1 = e09d9d  # Red
regular2 = a7c08a  # Green
regular3 = e6c384  # Yellow
regular4 = 7eb7f0  # Blue
regular5 = b4a7d6  # Magenta
regular6 = 7ddac5  # Cyan
regular7 = dcd7ba  # White

# Bright colors
bright0 = 665c54  # Black
bright1 = e09d9d  # Red
bright2 = a7c08a  # Green
bright3 = e6c384  # Yellow
bright4 = 7eb7f0  # Blue
bright5 = b4a7d6  # Magenta
bright6 = 7ddac5  # Cyan
bright7 = f2f0ec  # White

# Dim colors (optional)
dim0 = 151521  # Black
dim1 = e09d9d  # Red
dim2 = a7c08a  # Green
dim3 = e6c384  # Yellow
dim4 = 7eb7f0  # Blue
dim5 = b4a7d6  # Magenta
dim6 = 7ddac5  # Cyan
dim7 = dcd7ba  # White

# UI colors
selection-foreground = 1e1e2e
selection-background = dcd7ba
jump-labels = 1e1e2e a7c08a
scrollback-indicator = dcd7ba 7eb7f0
search-box-no-match = dcd7ba e09d9d
search-box-match = dcd7ba a7c08a
urls = a7c08a
flash = e6c384

# Extended 256 colors (optional)
# You can set colors 16-255 here if desired

# Alpha and transparency
alpha = 1.0
alpha-mode = default
dim-blend-towards = black

# Sixel palette
sixel0 = 1e1e2e
sixel1 = e09d9d
sixel2 = a7c08a
sixel3 = e6c384
sixel4 = 7eb7f0
sixel5 = b4a7d6
sixel6 = 7ddac5
sixel7 = dcd7ba
sixel8 = 665c54
sixel9 = f2f0ec
sixel10 = 151521
sixel11 = b4a7d6
sixel12 = e6c384
sixel13 = 7eb7f0
sixel14 = a7c08a
sixel15 = dcd7ba

