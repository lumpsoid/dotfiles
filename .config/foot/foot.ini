[main]
font=CascadiaCode-Mono:size=19

[colors]
# Background: very dark gray instead of pure black (easier on the eyes)
background=1a1a1a
# Foreground (text): slightly softer green
foreground=00ee00
# Cursor: dark background with bright green
cursor=1a1a1a 00ff00
# Selection color: green text on slightly lighter background
selection-foreground=00ee00
selection-background=2a2a2a
# Regular ANSI colors (improved differentiation)
regular0=1a1a1a      # black (dark gray)
regular1=cc3333      # red (dark red with slight green tint)
regular2=00ee00      # green (main text color)
regular3=cccc33      # yellow (greenish-yellow)
regular4=3366cc      # blue (dark blue-green)
regular5=cc33cc      # magenta (purple with green tint)
regular6=33cccc      # cyan (light blue-green)
regular7=cccccc      # white (light gray)
# Bright ANSI colors (for bold text)
bright0=666666       # bright black (gray)
bright1=ff6666       # bright red
bright2=00ff00       # bright green
bright3=ffff66       # bright yellow
bright4=6699ff       # bright blue
bright5=ff66ff       # bright magenta
bright6=66ffff       # bright cyan
bright7=ffffff       # bright white (pure white)
